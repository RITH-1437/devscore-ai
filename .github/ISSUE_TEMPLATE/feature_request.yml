name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you are trying to solve. Focus on the use case — we can discuss implementation details in the issue.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
      placeholder: It is hard to compare analysis scores across multiple repositories at once...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
      placeholder: Add a comparison view on the Insights page that shows side-by-side scores...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about
      placeholder: Export JSON and compare manually — works but is slow

  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Who benefits and when would they use this?
      placeholder: Developers preparing for interviews who want to highlight their strongest repos
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or related issues
